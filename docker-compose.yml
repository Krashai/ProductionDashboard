# Standalone stack for the ProductionDashboard kiosk frontend (Next.js).
#
# Separate from backend/docker-compose.yml, but joined to it through the
# shared `proddash_internal` network: the browser connects same-origin to
# `${BASE_PATH}/ws` on this server, which forwards the WebSocket upgrade to
# the backend (rewrite in next.config.mjs). Start the backend stack first —
# it creates that network. Also isolated from
# ProductionMonitor's `prod_net` and energy-guard's `energy_network`: own
# bridge network (`dashboard_frontend_net`) and own host port (3002),
# chosen to avoid the ports already bound on this host — see README.md
# "Instalacja na Raspberry Pi" for the full port map.
services:
  dashboard-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build-time values — see Dockerfile comment.
        # Where this server (not the browser) reaches the backend. The
        # default is the backend container's name on `proddash_internal`;
        # change it only if the backend runs on another host.
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://dashboard-plc-backend:8001}
        NEXT_PUBLIC_DATA_SOURCE: ${NEXT_PUBLIC_DATA_SOURCE:-ws}
        # Subpath this deployment is served under behind a reverse proxy
        # (e.g. "/infrastructure") — empty by default (served from "/").
        BASE_PATH: ${BASE_PATH:-}
    image: production-dashboard-frontend:latest
    container_name: dashboard-frontend
    restart: unless-stopped
    ports:
      - "3002:3000"
    networks:
      - dashboard_frontend_net
      - proddash_internal

networks:
  dashboard_frontend_net:
    driver: bridge
  # Created by backend/docker-compose.yml — see the comment there.
  proddash_internal:
    name: proddash_internal
    external: true
