# Standalone stack for the ProductionDashboard kiosk frontend (Next.js).
#
# Deliberately separate from backend/docker-compose.yml — the two can be
# deployed on different hosts (kiosk display vs. PLC gateway machine) and
# have no need to share a Docker network. Also isolated from
# ProductionMonitor's `prod_net` and energy-guard's `energy_network`: own
# bridge network (`dashboard_frontend_net`) and own host port (3002),
# chosen to avoid the ports already bound on this host — see README.md
# "Instalacja na Raspberry Pi" for the full port map.
services:
  dashboard-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* vars are inlined at build time by `next build` — see
        # Dockerfile comment. Override in `.env` next to this file if the
        # backend isn't reachable at the default address.
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8001/ws}
        NEXT_PUBLIC_DATA_SOURCE: ${NEXT_PUBLIC_DATA_SOURCE:-ws}
        # Subpath this deployment is served under behind a reverse proxy
        # (e.g. "/infrastructure") — empty by default (served from "/").
        BASE_PATH: ${BASE_PATH:-}
    image: production-dashboard-frontend:latest
    container_name: dashboard-frontend
    restart: unless-stopped
    ports:
      - "3002:3000"
    networks:
      - dashboard_frontend_net

networks:
  dashboard_frontend_net:
    driver: bridge
