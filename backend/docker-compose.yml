# Standalone stack for the ProductionDashboard PLC backend.
#
# Deliberately isolated from ProductionMonitor's gateway stack (own
# network, not `prod_net`) — per NewBackendPlan.md §5, the two stacks
# have no need to talk to each other, and this backend's own port (8001)
# was picked specifically to not collide with the gateway's already-used
# 8000/3000/3001/5432 on the same host.
services:
  dashboard-plc-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: production-dashboard-plc-backend:latest
    container_name: dashboard-plc-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - dashboard_plc_data:/app/data
    environment:
      - DASHBOARD_DB_PATH=/app/data/dashboard.db
      # Required, no default: guards every mutating (POST/PUT/DELETE)
      # /api/* route (see app/api/deps.py:require_admin_token). Provide
      # via a `.env` file next to this compose file (git-ignored) or a
      # shell export before `docker compose up` — the ${VAR:?...} syntax
      # below makes compose refuse to start rather than silently run
      # with no token / an empty one.
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:?Set ADMIN_API_TOKEN (env or .env) before starting — no default is provided, by design}
    networks:
      - dashboard_plc_net

networks:
  dashboard_plc_net:
    driver: bridge

volumes:
  dashboard_plc_data:
