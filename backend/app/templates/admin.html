<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Konfiguracja PLC — ProductionDashboard</title>
  <link rel="stylesheet" href="/static/admin/admin.css" />
  <script type="module" src="/static/admin/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <p class="eyebrow">ProductionDashboard</p>
      <h1 class="brand-title">Konfiguracja PLC</h1>
    </div>
    <label class="search">
      <span class="sr-only">Szukaj zmiennej</span>
      <input id="search" type="search" placeholder="Szukaj zmiennej, adresu, sterownika…  ( / )" autocomplete="off" />
    </label>
    <div class="topbar-actions">
      <span id="live-status" class="pill pill-amber" hidden>Brak połączenia z backendem</span>
      <details id="backup-menu" class="menu-wrap">
        <summary class="btn btn-ghost">Kopia zapasowa</summary>
        <div class="menu" role="menu"></div>
      </details>
      <button type="button" id="logout" class="btn btn-ghost">Wyloguj</button>
    </div>
  </header>

  <nav id="tabs" class="tabs" aria-label="Obszary i widoki"></nav>

  <main id="main" class="main">
    <p class="muted">Wczytywanie…</p>
  </main>

  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
  <aside id="drawer" class="drawer" role="dialog" aria-modal="true" hidden></aside>
  <dialog id="confirm-dialog" class="dialog"></dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <div id="login" class="login" hidden>
    <form class="login-card">
      <p class="eyebrow">ProductionDashboard</p>
      <h1 class="login-title">Konfiguracja PLC</h1>
      <p class="muted">Podaj token administratora (ADMIN_API_TOKEN z pliku .env backendu).</p>
      <label class="field">
        <span class="field-label">Token administratora</span>
        <input class="input" type="password" autocomplete="current-password" required />
      </label>
      <div class="form-error" role="alert" hidden></div>
      <button type="submit" class="btn btn-primary">Zaloguj</button>
    </form>
  </div>
</body>
</html>
